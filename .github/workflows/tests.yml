name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: wordpress/wp-content/plugins/certificate-generator

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      # setup-php's wp-cli tool install is unreliable; use a pinned release instead.
      - name: Install WP-CLI
        run: |
          curl -sSfL -o wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.11.0/wp-cli-2.11.0.phar
          chmod +x wp-cli.phar && sudo mv wp-cli.phar /usr/local/bin/wp
          wp --info

      - name: Download WordPress core
        run: wp core download --path=wordpress --skip-content --force

      - name: Write CI wp-tests-config.php
        working-directory: wordpress/wp-content/plugins/certificate-generator
        run: |
          cat > tests/wp-tests-config.php <<EOF
          <?php
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'DB_COLLATE', '' );
          \$table_prefix = 'wptests_';
          define( 'WP_TESTS_DOMAIN', 'localhost' );
          define( 'WP_TESTS_EMAIL', 'admin@example.com' );
          define( 'WP_TESTS_TITLE', 'Certificate Generator Test Suite' );
          define( 'WP_PHP_BINARY', 'php' );
          define( 'WPLANG', '' );
          define( 'ABSPATH', '${{ github.workspace }}/wordpress/' );
          EOF

      - name: Install Composer dependencies
        working-directory: wordpress/wp-content/plugins/certificate-generator
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit (unit + integration + functional + regression + security)
        working-directory: wordpress/wp-content/plugins/certificate-generator
        env:
          WP_PHPUNIT__DIR: ${{ github.workspace }}/wordpress/wp-content/plugins/certificate-generator/vendor/wp-phpunit/wp-phpunit
        run: composer test

      - name: Run phpstan
        working-directory: wordpress/wp-content/plugins/certificate-generator
        run: composer phpstan

      # ponytail: report-only — the legacy code has ~1,500 WPCS errors and phpcs has no baseline.
      # Make it blocking once `composer phpcs` is clean (or scope it to changed files).
      - name: Run phpcs (report only)
        working-directory: wordpress/wp-content/plugins/certificate-generator
        continue-on-error: true
        run: composer phpcs -- --report=summary

