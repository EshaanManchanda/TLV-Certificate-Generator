<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Certificate Generator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b86d6"/>
      <stop offset="1" stop-color="#123a73"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#eda413"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#06183a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Second certificate behind: "in bulk" -->
  <rect x="44" y="62" width="132" height="158" rx="14" fill="#ffffff" opacity="0.32" transform="rotate(-8 110 141)"/>

  <!-- Certificate -->
  <g filter="url(#shadow)">
    <rect x="66" y="46" width="136" height="164" rx="14" fill="#ffffff"/>
  </g>
  <rect x="78" y="58" width="112" height="140" rx="8" fill="none" stroke="#d7e3f4" stroke-width="3"/>
  <rect x="98" y="80" width="72" height="11" rx="5.5" fill="#1d5aa5"/>
  <rect x="92" y="106" width="84" height="7" rx="3.5" fill="#c3d3ea"/>
  <rect x="100" y="124" width="68" height="7" rx="3.5" fill="#c3d3ea"/>

  <!-- Seal with check: "verified" -->
  <g filter="url(#shadow)">
    <path d="M168 200 L158 238 L174 228 L184 242 L190 204 Z" fill="#d4900d"/>
    <path d="M196 200 L206 238 L190 228 L180 242 L174 204 Z" fill="#e9a516"/>
    <circle cx="182" cy="182" r="38" fill="url(#gold)"/>
  </g>
  <circle cx="182" cy="182" r="29" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="4 5"/>
  <path d="M167 182 L178 193 L198 171" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
